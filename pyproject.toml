[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge"
version = "1.0.0"
description = "Group-wise view-inconsistency rectification for feed-forward 4D tracking"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HCPLab-SYSU" }]
keywords = [
    "4d-tracking",
    "point-tracking",
    "monocular-video",
    "metric-scale",
    "post-hoc-correction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23,<3",
    "scipy>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/HCPLab-SYSU/GAUGE"
Paper = "https://arxiv.org/abs/2609.32596"
Issues = "https://github.com/HCPLab-SYSU/GAUGE/issues"

[tool.setuptools]
packages = ["gauge"]
